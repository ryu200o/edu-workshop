spring.application.name=edu-workshop

# Test datasource: embedded H2 in PostgreSQL-compatibility mode (fast, no Docker).
spring.datasource.url=jdbc:h2:mem:edu-workshop;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema 100%; Hibernate must not touch DDL (avoids H2<->Hibernate validate friction).
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# JOOQ shares the same datasource. Reads are type-safe SQL (CQRS bypass) against the Flyway schema.
# H2 runs in PostgreSQL-compatibility mode, so the Postgres dialect is valid for both test and runtime.
spring.jooq.sql-dialect=POSTGRES

# Do not attempt to start docker-compose during tests.
spring.docker.compose.enabled=false

# Spring Modulith Event Publication Registry (JPA) — transactional outbox.
# Flyway V7 creates the event_publication table (H2-compatible).
spring.modulith.events.publication-registry.enabled=true

# Attendance Reconciliation Window (ADR 0019 §4) — Operational Setting mirrored from the main
# application.properties so test contexts (which shadow the main file) bind the same default.
app.attendance.reconciliation.window-minutes=1440

# Workshop lifecycle scheduler (D4) — DISABLED in tests. The main application.properties enables it
# (app.workshop.lifecycle.enabled=true), but in the test JVM all @SpringBootTest contexts share the
# same embedded H2 DB (DB_CLOSE_DELAY=-1) AND Spring caches/reuses contexts, so any context left with
# the scheduler ON keeps a live Scheduled thread that auto-starts/auto-completes past-end workshops in
# the shared DB — flakily 409-ing registration/attendance E2E tests (e.g. AttendanceCommandControllerE2ETest).
# Disabling it globally guarantees no live scheduler thread pollutes the shared DB; the job logic itself
# is still covered by WorkshopLifecycleJobTest (which drives scan() directly with mocks).
app.workshop.lifecycle.enabled=false

# IAM Security layer (Slice 3) — mirrored from the main application.properties so test contexts
# (which shadow the main file) bind the same HS256 JWT key and policy knobs.
app.iam.jwt-secret=q5NoWs5rEUMsJpBpZfcOTQT5ArvnINldfzp+HikVpOTvtP8DhCmR4tzLHhCgsTld
app.iam.jwt-access-ttl-minutes=15
app.iam.jwt-refresh-ttl-days=7
app.iam.otp-ttl-hours=24
app.iam.security-enabled=true

# Attendance auto-finalize job (Slice 6) — DISABLED in tests. The main application.properties enables
# it (app.attendance.finalize-job.enabled=true). In the shared-H2 test JVM a live @Scheduled scanner
# would finalize rosters non-deterministically; the job logic itself is covered by a dedicated test
# that enables the property and drives scan() directly with mocks.
app.attendance.finalize-job.enabled=false
