spring.application.name=edu-workshop

# Test datasource: embedded H2 in PostgreSQL-compatibility mode (fast, no Docker).
spring.datasource.url=jdbc:h2:mem:edu-workshop;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema 100%; Hibernate must not touch DDL (avoids H2<->Hibernate validate friction).
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# JOOQ shares the same datasource. Reads are type-safe SQL (CQRS bypass) against the Flyway schema.
# H2 runs in PostgreSQL-compatibility mode, so the Postgres dialect is valid for both test and runtime.
spring.jooq.sql-dialect=POSTGRES

# Do not attempt to start docker-compose during tests.
spring.docker.compose.enabled=false

# Spring Modulith Event Publication Registry (JPA) — transactional outbox.
# Flyway V7 creates the event_publication table (H2-compatible).
spring.modulith.events.publication-registry.enabled=true

# Attendance Reconciliation Window (ADR 0019 §4) — Operational Setting mirrored from the main
# application.properties so test contexts (which shadow the main file) bind the same default.
app.attendance.reconciliation.window-minutes=1440
