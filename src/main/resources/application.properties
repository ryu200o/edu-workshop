spring.application.name=edu-workshop

# JOOQ shares the same datasource as JPA (logical C/Q split, single physical DB).
# Reads are type-safe SQL (CQRS bypass) against the Flyway-owned schema.
spring.jooq.sql-dialect=POSTGRES

# Spring Modulith Event Publication Registry (JPA) — the transactional outbox.
# The event_publication table is owned by Flyway (V7); Modulith persists one row
# per (event, listener) in the same business transaction and UPDATEs completion_date
# on listener success (completion-mode=update keeps the row for traceability).
spring.modulith.events.publication-registry.enabled=true

# Replay of outstanding publications on startup is OFF by default (single-instance
# only). Enable deliberately when a standalone instance must self-heal, e.g.:
# spring.modulith.events.republish-outstanding-events-on-restart=true

# ---------------------------------------------------------------------------
# Hibernate JDBC batching — makes bulk DML (e.g. RegistrationRepository.saveAll
# when refunding N active seats) flush as a single multi-row batch instead of N
# distinct SQL statements.
#
#   * jdbc.batch_size          : max statements grouped per batch before flush.
#   * order_inserts/order_updates : REQUIRED for batching to take effect — groups
#                                same-type INSERTs / UPDATEs together. Without
#                                these the batch degrades to row-per-statement.
#   * batch_versioned_data     : allows versioned rows (@Version / @OptimisticLock)
#                                to participate in a batch; safe here because the
#                                Registration aggregate has no @Version column yet.
# ---------------------------------------------------------------------------
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
